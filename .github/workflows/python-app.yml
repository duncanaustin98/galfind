# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3

    - name: Install SExtractor
      run: |
        sudo apt-get update
        # Ubuntu renamed the package from `sextractor` to `source-extractor`
        # (the old name is just a transitional dummy on some releases, and
        # gone entirely on newer ones like noble), so try the new name
        # first and fall back to the old one for older runners.
        sudo apt-get install -y --no-install-recommends source-extractor \
          || sudo apt-get install -y --no-install-recommends sextractor
        # Either package installs the binary as `source-extractor` (or
        # `sextractor` on older releases); galfind shells out to `sex`.
        if ! command -v sex >/dev/null 2>&1; then
          SEX_BIN="$(command -v source-extractor || command -v sextractor || true)"
          if [ -n "$SEX_BIN" ]; then
            sudo ln -s "$SEX_BIN" /usr/local/bin/sex
          else
            echo "WARNING: no sextractor/source-extractor binary found after install" >&2
          fi
        fi
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        WITH_OPENMP=1 pip install .
        pip install ruff pytest pytest-cov pytest-lazy-fixtures pre-commit
    - name: Run pre-commit checks
      run: pre-commit run --all-files
    - name: Test with pytest
      run: |
        pytest --cov=galfind --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy -m "not requires_data" testing
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
