# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      # galfind/imaging/PSF.py always overrides $STPSF_PATH to
      # config['PSF']['STPSF_CACHE'] (testing/test_galfind_config.ini:
      # PSF_WORK_DIR/stpsf_cache/stpsf-data, i.e. relative to the repo
      # checkout) before ever touching stpsf, ignoring whatever this env
      # var is set to -- so the calibration data must be downloaded to
      # that exact path, not stpsf's own default ($HOME/data/stpsf-data,
      # which auto_download_stpsf_data() hardcodes regardless of
      # $STPSF_PATH).
      STPSF_PATH: ${{ github.workspace }}/testing/test_work/PSFs/stpsf_cache/stpsf-data

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3

    - name: Install SExtractor
      run: |
        sudo apt-get update
        # Ubuntu renamed the package from `sextractor` to `source-extractor`
        # (the old name is just a transitional dummy on some releases, and
        # gone entirely on newer ones like noble), so try the new name
        # first and fall back to the old one for older runners.
        sudo apt-get install -y --no-install-recommends source-extractor \
          || sudo apt-get install -y --no-install-recommends sextractor
        # Either package installs the binary as `source-extractor` (or
        # `sextractor` on older releases); galfind shells out to `sex`.
        if ! command -v sex >/dev/null 2>&1; then
          SEX_BIN="$(command -v source-extractor || command -v sextractor || true)"
          if [ -n "$SEX_BIN" ]; then
            sudo ln -s "$SEX_BIN" /usr/local/bin/sex
          else
            echo "WARNING: no sextractor/source-extractor binary found after install" >&2
          fi
        fi
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        WITH_OPENMP=1 pip install .
        pip install ruff pytest pytest-cov pytest-lazy-fixtures pre-commit
    - name: Cache STPSF calibration data
      uses: actions/cache@v4
      with:
        path: ${{ env.STPSF_PATH }}
        # bump the trailing version suffix if stpsf ever needs newer
        # calibration data than this cache holds
        key: stpsf-data-v1
    - name: Download STPSF calibration data
      run: |
        mkdir -p "$STPSF_PATH"
        if [ -z "$(ls -A "$STPSF_PATH" 2>/dev/null)" ]; then
          python -c "
        import tarfile
        from pathlib import Path
        from urllib.request import urlretrieve
        target = Path('$STPSF_PATH')
        url = 'https://stsci.box.com/shared/static/kqfolg2bfzqc4mjkgmujo06d3iaymahv.gz'
        tmp = '/tmp/stpsf-data-LATEST.tar.gz'
        urlretrieve(url, tmp)
        with tarfile.open(tmp, 'r:gz') as tar:
            tar.extractall(target.parent)
        "
        fi
    - name: Run pre-commit checks
      run: pre-commit run --all-files
    - name: Test with pytest
      run: |
        pytest --cov=galfind --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy testing
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
