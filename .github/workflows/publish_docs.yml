# This workflow builds the Sphinx API documentation as a check that it
# still builds cleanly. Actual publishing to readthedocs.io is handled
# by Read the Docs' own webhook, not this workflow.

name: publish_docs

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        WITH_OPENMP=1 pip install .
        pip install sphinx sphinx-rtd-theme
    - name: Build API documentation
      run: |
        cd docs && make html
