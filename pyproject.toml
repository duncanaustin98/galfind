# Set up the build system
[build-system]

# Use latest setuptools, setuptools_scm for git versioning and
# numpy (numpy includes are needed for compilation of C extensions)
requires = ["setuptools>=64", "setuptools_scm>=8"] # , "numpy>=1.23"
build-backend = "setuptools.build_meta"

[project]
name = "galfind"

# Dynamic version numbers from git
dynamic = ["version"]

# Tagline for Galfind
description = "A flexible pipeline for optical and infra-red photometric observations"

# A longer description of Galfind
readme = "README.md"

# Minimum Python version
requires-python = ">=3.10"

# The licence
license = {file = "LICENCE.md"}

# Project keywords
keywords =[
  "galaxy",
  "galaxy formation",
  "cosmology",
  "galaxy evolution",
  "survey",
  "space telescope",
  "SED",
  "sed",
  "spectral energy distribution",
  "stellar population",
]

# Synthesizer authors
authors = [
  {name = "D. Austin", email = "duncan.austin@postgrad.manchester.ac.uk"},
  {name = "T. Harvey", email = "thomas.harvey-3@manchester.ac.uk"}
]

# Synthesizer maintainers
maintainers = [
  {name = "D. Austin", email = "duncan.austin@postgrad.manchester.ac.uk"},
  {name = "T. Harvey", email = "thomas.harvey-3@manchester.ac.uk"}
]

# Classifiers
classifiers = [  # Optional
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",  # 3 Alpha/4 Beta/5 Production/Stable
  "Intended Audience :: Astronomers",
  "Topic :: Flexible photometric pipeline",
  "License :: GNU GENERAL PUBLIC LICENSE v3.0",

  # Supported Python versions
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

# Dependencies
dependencies = [
  "asdf-astropy",
  "setuptools",
  "numpy>=2.0",
  "matplotlib", # pillow install issue
  "astropy",
  "astroquery",
  "tqdm",
  "h5py",
  "scipy",
  "sep", # 1.2.1 
  "photutils>=2.0", # <2.0 has no cp313 wheels and the 1.12.0 sdist on PyPI is broken (missing pyproject.toml/setup.py), crashing pip's resolver
  "opencv-python-headless", # headless build: no libGL/X11 dependency, needed for CI/RTD builds
  "joblib",
  "trilogy",
  "scikit-learn>=1.4.0", # earlier versions import a numpy-1.x-built pyarrow via sklearn.utils.fixes, which crashes under numpy>=2.0
  "scikit-image",
  "eazy",
  "regions",
  "typing",
  "kneed",
  "yagmail",
  "typing_extensions", # 4.12.2
  "numba>=0.67.0", # earlier versions refuse to import under numpy>=2.2
  "configparser",
  "ipykernel",
  "emcee",
  "lmfit",
  "spectres",
  "BDFit @ git+https://github.com/tHarvey303/BD-Finder/",
  "corner",
  "stpsf", # PSF.py imports this to build model PSFs; needs $STPSF_PATH calibration data at runtime
  "pypher", # PSF.py's make_kernel() shells out to the `pypher`/`addpixscl` CLIs it installs
]
# numpy>=2.0 requires numba>=0.67.0 (llvmlite pulled in automatically) and
# scikit-learn>=1.4.0 (its numpy-1.x-built pyarrow import otherwise crashes);
# sep itself has supported numpy>=2.0 since before this pin was added.
# NB: scikit-learn's own Python floor keeps rising each release (1.7+ needs
# >=3.10, 1.8+ needs >=3.11) -- check that against requires-python above and
# the CI matrix before raising this pin any further.
#grizli
#msaexp

# Optional dependencies for specific use cases
[project.optional-dependencies]
# Development
dev = [
    "ruff==0.6.4",
]
# Testing
test = [
    "pytest",
    "pytest-lazy-fixtures",
    "mypy",
    "ruff",
    "nbmake"
]
#    "ruff>=0.3.0",
#    "mypy>=0.910",

bagpipes = [
  "bagpipes @ git+https://github.com/tHarvey303/bagpipes/",
]

# PySersic morphology fitting (galfind.properties.PySersic); pulls in
# jax/numpyro transitively
pysersic = [
  "pysersic",
]

# msaexp: NIRSpec 1D extraction/plotting used by galfind.spectra.Spectrum
spectra = [
  "msaexp",
]

# Downloading data
data = [
    "click",
    "dropbox"
]

# Documentation building
docs = [
    "sphinx==7.4.7",
    "sphinx_rtd_theme",
    "pandoc",
    "nbsphinx",
    "sphinx-copybutton",
    "sphinx_autodoc_typehints",
]
#"nbmake",

#"ipython",
#"sphinx_gallery",
#"pillow",
#"sphinx-toolbox",

# Project urls
[project.urls]
"Homepage" = "https://github.com/duncanaustin98/galfind"
"Bug Reports" = "https://github.com/duncanaustin98/galfind/issues"
"Source" = "https://github.com/duncanaustin98/galfind"
#"Documentation" = "https://flaresimulations.github.io/synthesizer/"

# Entry points
#[project.scripts]
galfind-config-update = "galfind.change_config:main"
#synthesizer-download="synthesizer.download_data:download"

# Package data: non-.py files that live inside the galfind/ package and are
# needed at runtime (not just for local development), e.g. IGM attenuation
# grids and SExtractor wrapper scripts. Without this, `pip install .` silently
# omits them and anything touching IGM_attenuation/SExtractor crashes with a
# FileNotFoundError on first use.
[tool.setuptools.package-data]
galfind = [
    "*.sh",
    "*.mplstyle",
    "IGM_attenuation/*.fits",
    "IGM_attenuation/*.h5",
    "Aperture_corrections/*.dat",
    "Aperture_corrections/*.txt",
]

[tool.setuptools.packages.find]
# build* excluded to stop each build from recursively re-packaging its own
# previous output as if it were source (this is how build/ ended up 851MB
# deep with nested build/lib/build/lib/... copies)
exclude = ["unit_testing*", "NIRCam_pipeline*", "build*"]

[tool.setuptools_scm]

# Make a version file at build time
version_file = "galfind/_version.py"

# Configure the linter and formatter
[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    ".DS_Store",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*__init__.py",  # ignore all init files
    "NIRCam_pipeline",
    "docs",
    "configs",
]

# PEP-8 line length
line-length = 79
indent-width = 4

# Assume Python 3.8 by default regardless
target-version = "py38"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and pycodestyle (`E`)  codes by default.
select = ["F", "E", "W"]
ignore = [
       "E402",  # "module level import not at top of file" (isolate C imports in case python alternatives exist)
       "F811",  # "redefinition of unused name from line N" (breaks quantity objects)
       ]

# Sort imports alphabetically
extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
# Set pytest markers
markers = [
  "slow: marks slow tests",
  "instrument: tests that require instrument setup",
  "requires_data: marks tests requiring data to run",
  "lephare: tests requiring a local LePhare install (LEPHAREDIR/LEPHAREWORK); excluded in CI since LePhare is a separate compiled Fortran/C++ codebase, not pip-installable (see galfind.def). Some also currently produce empty SED results for the synthetic test galaxy (unresolved)",
]