# This file contains the configuration for pre commit hooks used to sanitise the repository.
repos:
  # General pre-commit hooks to stop bad things happening.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-merge-conflict  # Check for files that contain merge conflict strings.
    -   id: check-case-conflict # Ensure we don't have case clashes in the repository.
    -   id: check-added-large-files  # Prevent large files from being added to the repository.

  # Linting and formatting for Python.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.6.0
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
        files: ^galfind/
      # Run the formatter.
      - id: ruff-format
        files: ^galfind/
      # Full-repo lint check before a push reaches origin (also runs at
      # commit time so `pre-commit run --all-files` in CI catches it too).
      # examples/ is gitignored (scratch/plotting scripts, not part of the
      # package) but still git-tracked, so it must be excluded explicitly.
      - id: ruff
        name: ruff check (full repo, pre-push)
        alias: ruff-check-push
        stages: [pre-commit, pre-push]
        exclude: ^examples/

  # Sanitise Jupyter notebooks.
  - repo: https://github.com/srstevenson/nb-clean
    rev: 3.3.0
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-metadata
          - tags
          - -M
          - --